    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2822134581499321');
      // O id do evento fica guardado na window pra que o React, assim que
      // subir, mande a cópia deste MESMO PageView pela API de Conversões. Com
      // o id igual nos dois lados, a Meta conta uma conversão só.
      // O PageView tem de sair daqui, e não do React: quem fecha a página nos
      // primeiros segundos só é contada se o disparo vier antes do bundle.
      window.__fbPageViewId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 11);
      fbq('track', 'PageView', {}, { eventID: window.__fbPageViewId });
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Utmify Pixel -->
    <!-- A Utmify entrega esse trecho embrulhado em base64 com XOR. Decodificado,
         ele faz exatamente o que está abaixo: define window.pixelId e carrega o
         pixel.js do CDN deles. Aqui fica na forma legível, que é idêntica em
         funcionamento e permite conferir o que entra na página. -->
    <script>
      window.pixelId = "6aac514b41590ab952ad93ca";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>
    <!-- End Utmify Pixel -->

    </script>

    <!-- Fallback do Meta Pixel pra quem está sem JavaScript. Fica no <body>
         porque <img> dentro de <noscript> no <head> é HTML inválido, e o
